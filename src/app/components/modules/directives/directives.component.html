<div>
  @if(directivesData && isVisible){ @for(item of directivesData; track item){

    <app-cards [data]="item">
      <a (click)="loadTemplate(item.template)">Clique e veja</a>
    </app-cards>

    } }
  </div>
  @if (selectedTemplate && isVisible) {
    <span
      [innerText]="selectedTemplate"
    ></span>
  }
